name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: sxzz/workflows/.github/workflows/release.yml@v1
    permissions:
      contents: write
      # npm trusted publishing (OIDC) - no NPM_TOKEN secret needed.
      id-token: write
    with:
      publish: true
      build: pnpm build
      # Prereleases (v0.2.0-beta.0) go to the `beta` dist-tag, so `latest`
      # only ever moves on stable versions.
      tag: ${{ contains(github.ref_name, '-') && 'beta' || '' }}
