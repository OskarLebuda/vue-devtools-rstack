name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    uses: sxzz/workflows/.github/workflows/release.yml@v1
    permissions:
      contents: write
      # npm trusted publishing (OIDC) - no NPM_TOKEN secret needed.
      id-token: write
    with:
      # 0.1.0 was published manually - trusted publishing cannot bootstrap a
      # package that does not exist yet. Re-enabled right after this tag.
      publish: false
      build: pnpm build
